# Used by `helm lint` / `ct lint`: every optional value and component set at
# once (api + mcp + mcp route + a2a + a2a route + HPA + gateway + ingress).
database:
  url: "postgres://u@example.invalid:5432/db"
  migrationsUrl: "postgres://u@example.invalid:5432/direct"
  existingSecretKey: "DATABASE_URL"
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
kafka:
  brokers: "kafka.example.invalid:9092"
config:
  logLevel: "debug"
  shoppingCartUrl: "http://shopping-cart.example.invalid"
  deliveryPromiseUrl: "http://delivery-promise.example.invalid"
  pricingUrl: "http://pricing.example.invalid"
  customerPaymentsUrl: "http://customer-payments.example.invalid"
  customerOrderingUrl: "http://customer-ordering.example.invalid"
  siblingTimeout: "3s"
  customerOrderingTimeout: "10s"
  indoubtSweepInterval: "10s"
  stuckSweepInterval: "20s"
  voidSweepInterval: "30s"
  expirySweepInterval: "40s"
  purgeSweepInterval: "2h"
  outboxRelayInterval: "2s"
  outboxMaxAttempts: 20
  shutdownDrainDelay: "5s"
autoscaling:
  api:
    enabled: true
ingress:
  enabled: true
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/checkout
      pathType: PathPrefix
mcp:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
a2a:
  enabled: true
  route:
    enabled: true
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
