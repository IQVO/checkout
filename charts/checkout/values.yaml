# Default values for checkout. One always-on component: the api Deployment
# (cmd/api: REST, the outbox relay and the five clock-driven saga policies in
# one process); the read-only MCP server (cmd/mcp, ADR 0005) is a second,
# optional component. The chart refuses to render without the mandatory values
# below (named in the failure): database.*, kafka.brokers and the five
# config.*Url sibling base URLs.

replicaCount: 1

# The image is built from this repository's Dockerfile (ENTRYPOINT ./api,
# binaries /app/api and /app/mcp, user 1000, root filesystem never written).
image:
  repository: warehouse/checkout
  pullPolicy: IfNotPresent
  # Empty = "v" + the chart's appVersion (the release job tags the image v<version>).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 (Dockerfile USER 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Optional exposure, default off. Both route to the api Service only.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: checkout.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2), default off. When enabled the
# Deployment omits replicas so the HPA owns them. N>1 is safe for the outbox
# relay (row claims) and the saga writes (optimistic state transitions); it has
# not been load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go, cmd/api/main.go,
# cmd/api/workers.go). Every key maps 1:1 to one variable; nothing else is
# rendered.
config:
  httpAddr: ":8080"                    # HTTP_ADDR (its port must equal service.targetPort)
  logLevel: "info"                     # LOG_LEVEL: debug | info | warn (or warning) | error
  # The five sibling base URLs the saga calls synchronously (authorize, price,
  # quote, promise, place-order). ALL REQUIRED: cmd/api exits at boot naming
  # the missing one.
  shoppingCartUrl: ""                  # SHOPPING_CART_URL
  deliveryPromiseUrl: ""               # DELIVERY_PROMISE_URL
  pricingUrl: ""                       # PRICING_URL
  customerPaymentsUrl: ""              # CUSTOMER_PAYMENTS_URL
  customerOrderingUrl: ""              # CUSTOMER_ORDERING_URL
  # SIBLING_TIMEOUT: per-call timeout of the siblings (Go duration). Empty =
  # not rendered; the binary defaults to 5s.
  siblingTimeout: ""
  # CUSTOMER_ORDERING_TIMEOUT: bounds the place-order call (Go duration).
  # Empty = not rendered; the binary defaults to 15s.
  customerOrderingTimeout: ""
  # The five clock-driven saga policies. Empty = not rendered; the binary
  # defaults to 15s / 30s / 1m / 1m / 1h respectively.
  indoubtSweepInterval: ""             # INDOUBT_SWEEP_INTERVAL (ResolveInDoubtPlacements)
  stuckSweepInterval: ""               # STUCK_SWEEP_INTERVAL (ResolveStuckAuthorizations)
  voidSweepInterval: ""                # VOID_SWEEP_INTERVAL (RetryOwedVoids)
  expirySweepInterval: ""              # EXPIRY_SWEEP_INTERVAL (ExpireOnQuoteExpiry)
  purgeSweepInterval: ""               # PURGE_SWEEP_INTERVAL (PurgeStoredPlacements)
  # OUTBOX_RELAY_INTERVAL: Go duration or plain seconds. Empty = not rendered
  # (the binary defaults to 1s).
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS: failures before the relay excludes an outbox row so a
  # poison row cannot block it; re-arm with
  # `UPDATE outbox_events SET attempts = 0 WHERE id = ...`. 0 = unlimited.
  outboxMaxAttempts: 20
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before the listener closes.
  # Empty = not rendered (the binary defaults to 5s). Whole seconds ("5s"),
  # minutes ("1m") or "0"; the chart needs the number to size the grace period.
  shutdownDrainDelay: ""

# The chart refuses to render unless database.url or database.existingSecret is
# set. DATABASE_URL always comes from a Secret (secretKeyRef), never from the
# ConfigMap.
database:
  # A DSN the chart stores in a Secret it creates. Prefer existingSecret.
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same Secret, of a DIRECT (non-pooled, session-mode) DSN used only
  # for the boot migrations (MIGRATIONS_DATABASE_URL), `optional: true` so a
  # Secret without it still starts the pod (the binary falls back to
  # DATABASE_URL). With database.url set, migrationsUrl fills it.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"
  migrationsUrl: ""

# KAFKA_BROKERS (comma-separated) is MANDATORY: the outbox relay and /readyz
# dial Kafka. This context CONSUMES no topic (no consumer, no consumer group).
# Produced topics: retailnetwork.checkout.events,
# retailnetwork.checkout.analytics.
kafka:
  brokers: ""

# Fleet observability standard (ADR 0006): OTLP/gRPC to the in-cluster Collector
# --> Jaeger (traces) and Prometheus (metrics); logs are stdout JSON for Alloy
# and Loki. Export never blocks, so a Collector that is down costs telemetry and
# nothing else, but otel.enabled=false renders no OTEL_* env at all (the binaries
# then fall back to telemetry.DefaultEndpoint). serviceName is OTEL_SERVICE_NAME
# of the api; the mcp component gets "<serviceName>-mcp". SERVICE_VERSION is the
# image tag (appVersion when empty), ENVIRONMENT is `environment`.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "checkout"

# ENVIRONMENT of the api: deployment.environment.name on every span, metric and
# log of the api. (mcp.environment sets the same for the mcp component.)
environment: "production"

# Extra env vars appended to the api container as a raw list. The chart refuses
# any *_MODE variable (this service has no mode: Postgres and Kafka are the only
# runtime), any *_CONSUMER_GROUP (this context consumes no topic) and any
# variable the chart renders itself.
extraEnv: []

# The Postgres dial and the migrations at boot run inside a bounded retry
# (internal/bootretry), so the startup probe allows ~60s.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's sequential graceful shutdown (cmd/api/main.go,
# cmd/api/workers.go): SHUTDOWN_DRAIN_DELAY (5s) + HTTP drain (10s) + each of
# the 5 schedulers awaited up to 10s one after the other (50s) + the outbox
# relay (10s) = 75s worst case. The chart refuses anything that does not
# exceed that sum for the configured drain delay (a shorter period SIGKILLs a
# scheduler or the relay mid-drain).
terminationGracePeriodSeconds: 80

# The optional MCP server (ADR 0005): cmd/mcp, a read-only second deployable
# serving the one tool get_checkout_session over the SAME GetSession use case
# the REST adapter uses, over Streamable HTTP (/mcp) on :8090 with an open
# /healthz. Never dials Kafka, runs no relay and no policy, calls no sibling
# context, and has NO auth (fleet-wide revert 2026-09-11): access control is
# the in-cluster ClusterIP boundary. Needs database.* like the api (the same
# Secret), nothing else.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"                  # MCP_ADDR (Streamable HTTP /mcp + /healthz)
  # SERVICE_VERSION / ENVIRONMENT: the labels cmd/mcp reports on its telemetry.
  # serviceVersion empty = the image tag (appVersion when empty), like the api;
  # set it only to override.
  serviceVersion: ""
  environment: "production"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Gateway exposure: /api/mcp/checkout -> Service :8090, prefix rewritten to
  # /mcp (the SDK's canonical endpoint). Needs the Gateway parentRef from
  # warehouse-infra; NO auth of any kind on the route.
  route:
    enabled: false
    path: "/api/mcp/checkout"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
